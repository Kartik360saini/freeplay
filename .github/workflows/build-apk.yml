name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: freeplay

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: |
          flutter create --platforms=android --org com.freeplay --project-name freeplay "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" ./android

      - name: Patch Android project
        run: python3 tool/patch_android.py .

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freeplay-apk
          path: freeplay/build/app/outputs/flutter-apk/app-release.apk
