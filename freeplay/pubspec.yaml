name: freeplay
description: Search, download and play freely licensed music, with local playlists and Spotify playlist support.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_web_auth_2: ^4.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  permission_handler: ^11.3.1
  provider: ^6.1.2

flutter:
  uses-material-design: true
